# Dadinho — nginx de borda (Fase 59 + 61): taxa por IP + proxy da API na VPS.
#
# O Cloudflare Tunnel (container `tunnel`, network host) conecta em
# http://localhost:8090; este nginx publica SÓ em loopback (127.0.0.1:8090) e
# faz proxy para as réplicas `api`/`api2`/`api3`/`api4:8000`. O UFW (deny
# default) continua sem abrir porta nenhuma — a borda pública é o Cloudflare.
# (A porta 8080 NÃO é usada: na VPS o `crowdsec` já escuta 127.0.0.1:8080.)
#
# A chave do rate limit usa o IP REAL do cliente: atrás do tunnel o
# `$remote_addr` é 127.0.0.1 para todo mundo — limitar por ele agruparia o
# mundo inteiro como um só IP. `$ip_real` segue Cf-Connecting-Ip (cloudflared)
# → X-Forwarded-For → remote_addr.
#
# Fase 61 (multi-worker): a session Engine.IO vive na memória da réplica, então
# as requests de um MESMO cliente (handshake + polling + upgrade do WebSocket)
# precisam cair na MESMA réplica — `hash $ip_real consistent;` pina por IP real
# (estável via Cf-Connecting-Ip; o `sid` muda a cada reconexão, o IP não).
# Emits entre réplicas rolam pela message queue (DADINHO_MESSAGE_QUEUE), não
# por broadcast local.
#
# Limites (por IP real):
#   /socket.io/  — 60 req/s (handshake + polling + upgrade)
#   demais rotas — 10 req/s (abuso de /, robots, etc.) + body máx 100 KB
# Um humaninho normal usa ~1 req/s de polling; 60/s só aperta farm/bot.

events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_for $ip_real_fb {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    map $http_cf_connecting_ip $ip_real {
        default $http_cf_connecting_ip;
        "" $ip_real_fb;
    }

    limit_req_zone $ip_real zone=dadinho_socketio:10m rate=60r/s;
    limit_req_zone $ip_real zone=dadinho_rest:10m rate=10r/s;

    upstream dadinho_api {
        # Sticky por IP real (Fase 61): o `sid` muda a cada reconexão, o IP não.
        hash $ip_real consistent;
        server api:8000;
        server api2:8000;
        server api3:8000;
        server api4:8000;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        # Fora de upgrade: "" deixa o nginx omitir o header Connection e reusar
        # a conexão (HTTP/1.1 + upstream keepalive). `close` mataria o keepalive.
        '' "";
    }

    log_format dadinho_json escape=json '{'
        '"ts":"$time_iso8601",'
        '"ip_real":"$ip_real",'
        '"via":"$http_cf_connecting_ip",'
        # Fase 64/D1: réplica que atendeu a request (ip:porta do upstream). Se
        # variar entre requests próximas do MESMO ip_real, é a assinatura do
        # sticky por IP quebrado (rede móvel trocando o IP) — ver runbook §9.1.
        '"upstream":"$upstream_addr",'
        '"metodo":"$request_method",'
        # `$uri` (sem query): a query do handshake carrega o token do captcha
        # (Turnstile, single-use) — não vai para o log.
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"latencia_ms":$request_time,'
        '"referer":"$http_referer",'
        '"agente":"$http_user_agent"'
        '}';

    server {
        # DENTRO do container: escutar em 80 (todas as interfaces). O binding só
        # em loopback do host é garantido pelo mapeamento `127.0.0.1:8090:80` no
        # docker-compose — aqui `listen 127.0.0.1:80` deixaria o mapeamento de
        # porta (que entrega no IP da bridge do container) sem ninguém escutando.
        listen 80;
        server_name localhost;

        access_log /dev/stdout dadinho_json;
        error_log /dev/stderr warn;

        client_max_body_size 100k;
        keepalive_timeout 65;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Sessão Engine.IO ociosa: o ping é 15s — 60s absorve a folga sem matar o socket.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        location /socket.io/ {
            limit_req zone=dadinho_socketio burst=40 nodelay;
            proxy_pass http://dadinho_api;
        }

        location / {
            limit_req zone=dadinho_rest burst=10 nodelay;
            proxy_pass http://dadinho_api;
        }
    }
}